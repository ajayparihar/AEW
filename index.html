  Description: HTML structure for the AEW application. Includes a header with the title, a dashboard section, and a card container.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AEW application - Dashboard for managing projects, cities, and companies.">
    <title>AEW</title>

    <!-- Favicon and Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <!-- Stylesheet and Fonts -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
    <header role="banner">
        <div class="logo-container">
            <img src="svg/aew-full_logo.svg" alt="AEW" id="logo" aria-label="Reload the page" class="clickable">
            <span class="logo-fallback">AEW</span>
        </div>
        <div class="title-container">
            <img src="svg/AEW.svg" alt="AEW" id="header-title" aria-label="Reload the page" class="clickable">
            <span class="title-fallback">AEW</span>
        </div>
    </header>
    
    <main>
        <section id="dashboard">
            <div id="total-projects">Total Projects: <span id="projects-count">0</span></div>
            <div id="distinct-cities">Cities: <span id="cities-count">0</span></div>
            <div id="distinct-companies">Companies: <span id="companies-count">0</span></div>
        </section>

        <section id="loading-screen" style="display: none;">
            <img src="svg/AEW-COG.svg" alt="Loading indicator" id="loading-cog">
        </section>

        <section id="card-container"></section>
    </main>

    <script src="script.js" type="module" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('logo');
            const headerTitle = document.getElementById('header-title');

            // Reload the page when logo or header title is clicked
            logo.addEventListener('click', () => location.reload());
            headerTitle.addEventListener('click', () => location.reload());
        });
    </script>
</body>
</html>
