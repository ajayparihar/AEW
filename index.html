  Description: HTML structure for the AEW application. Includes a header with the title, a dashboard section, and a card container.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AEW application - Dashboard for managing projects, cities, and companies.">
    <title>AEW</title>

    <!-- Favicon and Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">
    <link rel="manifest" href="manifest.json">

    <!-- Stylesheet and Fonts -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="svg/aew-full_logo.svg" alt="AEW" id="logo" class="clickable">
            <span class="logo-fallback">AEW</span>
        </div>
        <div class="title-container">
            <img src="svg/AEW.svg" alt="AEW" id="header-title" class="clickable">
            <span class="title-fallback">AEW</span>
        </div>
    </header>
    
    <main>
        <section id="dashboard">
            <div id="total-projects">Total Projects: <span id="projects-count">0</span></div>
            <div id="distinct-cities">Cities: <span id="cities-count">0</span></div>
            <div id="distinct-companies">Companies: <span id="companies-count">0</span></div>
        </section>

        <section id="loading-screen" style="display: none;">
            <img src="svg/AEW-COG.svg" alt="Loading indicator" id="loading-cog">
        </section>

        <section id="card-container"></section>
    </main>

    <div class="popup-overlay" id="projectsPopup">
        <div class="popup-content">
            <div class="popup-close" id="closeProjectsPopup">&times;</div>
            <div class="popup-search">
                <input type="text" id="projectSearch" placeholder="Search projects...">
            </div>
            <ul class="popup-list" id="projectsList"></ul>
        </div>
    </div>

    <div class="popup-overlay" id="citiesPopup">
        <div class="popup-content">
            <div class="popup-close" id="closeCitiesPopup">&times;</div>
            <div class="popup-search">
                <input type="text" id="citySearch" placeholder="Search cities...">
            </div>
            <ul class="popup-list" id="citiesList"></ul>
        </div>
    </div>

    <div class="popup-overlay" id="companiesPopup">
        <div class="popup-content">
            <div class="popup-close" id="closeCompaniesPopup">&times;</div>
            <div class="popup-search">
                <input type="text" id="companySearch" placeholder="Search companies...">
            </div>
            <ul class="popup-list" id="companiesList"></ul>
        </div>
    </div>

    <script src="script.js" type="module" defer></script>
</body>
</html>
