  Description: HTML structure for the AEW application. Includes a header with the title, a dashboard section, and a card container.
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AEW application - Dashboard for managing projects, cities, and companies.">
    <title>AEW</title>

    <!-- Favicon and Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png">
    <link rel="manifest" href="favicon_io/site.webmanifest">

    <!-- Stylesheet and Fonts -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

    <style>
        /* Add this CSS to prevent scrolling */
        .no-scroll {
            overflow: hidden;
            height: 100%;
        }
        /* Ensure the body takes full height to prevent scrolling */
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        /* Allow scrolling only when no-scroll class is not present */
        body:not(.no-scroll) {
            overflow: auto;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="svg/aew-full_logo.svg" alt="AEW" id="logo" class="clickable">
            <span class="logo-fallback">AEW</span>
        </div>
        <div class="title-container">
            <img src="svg/AEW.svg" alt="AEW" id="header-title" class="clickable">
            <span class="title-fallback">AEW</span>
        </div>
    </header>
    
    <main>
        <section id="dashboard">
            <div id="total-projects">Total Projects: <span id="projects-count">0</span></div>
            <div id="distinct-cities">Cities: <span id="cities-count">0</span></div>
            <div id="distinct-companies">Companies: <span id="companies-count">0</span></div>
        </section>

        <section id="loading-screen" style="display: none;">
            <img src="svg/AEW-COG.svg" alt="Loading indicator" id="loading-cog">
        </section>

        <section id="card-container"></section>
    </main>

    <div class="popup-overlay" id="projectsPopup">
        <div class="popup-content">
            <div class="popup-close" id="closeProjectsPopup">&times;</div>
            <div class="popup-search">
                <input type="text" id="projectSearch" placeholder="Search projects...">
            </div>
            <ul class="popup-list" id="projectsList"></ul>
        </div>
    </div>

    <div class="popup-overlay" id="citiesPopup">
        <div class="popup-content">
            <div class="popup-close" id="closeCitiesPopup">&times;</div>
            <div class="popup-search">
                <input type="text" id="citySearch" placeholder="Search cities...">
            </div>
            <ul class="popup-list" id="citiesList"></ul>
        </div>
    </div>

    <div class="popup-overlay" id="companiesPopup">
        <div class="popup-content">
            <div class="popup-close" id="closeCompaniesPopup">&times;</div>
            <div class="popup-search">
                <input type="text" id="companySearch" placeholder="Search companies...">
            </div>
            <ul class="popup-list" id="companiesList"></ul>
        </div>
    </div>

    <script src="script.js" type="module" defer></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logo = document.getElementById('logo');
            const headerTitle = document.getElementById('header-title');
            const body = document.body;

            // Reload the page when logo or header title is clicked
            logo.addEventListener('click', () => location.reload());
            headerTitle.addEventListener('click', () => location.reload());

            // Function to show popup and prevent background scrolling
            function showPopup(popupId) {
                document.getElementById(popupId).style.display = 'block';
                body.classList.add('no-scroll');
            }

            // Function to hide popup and allow background scrolling
            function hidePopup(popupId) {
                document.getElementById(popupId).style.display = 'none';
                body.classList.remove('no-scroll');
            }

            // Example usage for project popup
            document.getElementById('closeProjectsPopup').addEventListener('click', () => hidePopup('projectsPopup'));
            document.getElementById('closeCitiesPopup').addEventListener('click', () => hidePopup('citiesPopup'));
            document.getElementById('closeCompaniesPopup').addEventListener('click', () => hidePopup('companiesPopup'));

            // Add event listeners to open popups as needed
            // Example: document.getElementById('openProjectsPopup').addEventListener('click', () => showPopup('projectsPopup'));
        });
    </script>
</body>
</html>
